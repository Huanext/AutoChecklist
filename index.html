<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#0f766e;--acc2:#ccfbf1;
--ok:#16a34a;--okb:#dcfce7;--warn:#d97706;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;--na:#f1f5f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2b;--ink:#e5e7eb;--mut:#94a3b8;--line:#1f2a3d;--acc:#2dd4bf;--acc2:#123a37;
--ok:#4ade80;--okb:#14361f;--warn:#fbbf24;--warnb:#3a2c0b;--bad:#f87171;--badb:#3b1414;--na:#162033}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Sarabun,"Segoe UI",Tahoma,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
main{padding:16px 20px;max-width:1500px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
select,input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .t{font-size:12.5px;color:var(--mut);min-height:36px}
.card .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--mut)}
.bar{height:5px;border-radius:3px;background:var(--na);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{border:0;background:none;color:var(--mut);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-weight:600;font-size:12.5px;color:var(--mut);cursor:pointer;z-index:2}
td.n,th.n{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.g{background:var(--okb);color:var(--ok)}.y{background:var(--warnb);color:var(--warn)}.r{background:var(--badb);color:var(--bad)}.x{color:var(--mut)}
.cal td{padding:0;text-align:center;width:22px;min-width:22px;height:22px;font-size:11px}
.cal td.sh{text-align:left;padding:0 8px;width:auto;position:sticky;left:0;background:var(--card);z-index:1}
.c0{background:var(--badb)}.c1{background:var(--warnb)}.c2{background:var(--okb)}.cn{background:var(--na)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;background:var(--c)}
.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;background:var(--card);margin:20px auto;max-width:720px}
.drop.hover{border-color:var(--acc);background:var(--acc2)}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
code{background:var(--na);padding:1px 5px;border-radius:4px}
.bm{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:grab}
@media (max-width:640px){header,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <div><h1>Auto Checklist</h1><div class="sub" id="asof">ยังไม่มีข้อมูล</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <label class="btn">โหลดไฟล์ข้อมูล (.json)<input type="file" id="fData" accept=".json" hidden></label>
    <label class="btn">อัปเดต Master Shop (.xlsx)<input type="file" id="fMaster" accept=".xlsx,.xls" hidden></label>
    <button class="btn p" id="bXls" disabled>Export Excel</button>
  </div>
</header>
<main>
  <div id="start" class="drop">
    <div style="font-size:16px;font-weight:600;margin-bottom:6px">ลากไฟล์ checklist_data_*.json มาวางที่นี่</div>
    <div class="sub">หรือกดปุ่ม “โหลดไฟล์ข้อมูล” ด้านบน • ไฟล์ได้จากปุ่ม Auto Checklist บนหน้า Retail Checklist Report</div>
    <div class="note" id="mstat"></div>
    <div class="note" style="margin-top:18px">ติดตั้งปุ่ม (ครั้งเดียว): ลากปุ่มนี้ไปวางที่แถบบุ๊กมาร์กของ Chrome →
      <a class="bm" id="bmk" href="#">Auto Checklist</a></div>
  </div>
  <div id="app" hidden>
    <div class="filters">
      <select id="sRegion"></select><select id="sArea"></select><select id="sType"></select><select id="sFrm"></select>
      <select id="sScope" title="สาขาที่ต้องทำ Fraud Checklist">
        <option value="frm">Fraud: สาขาที่มี FRM ดูแล</option>
        <option value="s">Fraud: Size S</option>
        <option value="sfrm">Fraud: Size S และมี FRM</option>
        <option value="any">Fraud: Size S หรือมี FRM</option>
      </select>
      <input type="search" id="q" placeholder="ค้นหารหัส/ชื่อสาขา">
      <label class="sub"><input type="checkbox" id="onlyMiss"> เฉพาะที่ยังไม่ครบ</label>
    </div>
    <div class="cards" id="cards"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
    <div class="note" id="foot"></div>
  </div>
</main>

  $('#cards').innerHTML = TOPICS.map(T => { const a = topicAgg(rows, T.k); return `<div class="card"><div class="t">${T.name}<br><span style="font-size:11.5px">${FREQ[T.f]}</span></div><div class="v" style="color:${col(a.p)}">${fp(a.p)}</div><div class="s">${T.f === 'M' ? `${a.d}/${a.u} สาขา` : `${a.d.toLocaleString()}/${a.u.toLocaleString()} ครั้ง • ${a.n} สาขา`}</div><div class="bar"><i style="width:${(a.p || 0) * 100}%;background:${col(a.p)}"></i></div></div>`; }).join('');
  const tabs = [['shop', 'รายสาขา'], ['area', 'รายพื้นที่'], ['cal', 'ปฏิทินรายวัน'], ['tm', 'Retail TM รายบุคคล'], ['miss', 'รายการที่ขาด'], ['rule', 'เงื่อนไข']];
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${TAB === k ? 'on' : ''}" data-k="${k}">${l}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { TAB = b.dataset.k; render(); });
  const V = $('#view');
  if (TAB === 'shop') {
    let list = rows.slice();
    if (SORT) list.sort((a, b) => { const va = SORT.k === 'pct' ? a.pct : a.t[SORT.k] ? pct(a.t[SORT.k].done, a.t[SORT.k].due) ?? -1 : -2, vb = SORT.k === 'pct' ? b.pct : b.t[SORT.k] ? pct(b.t[SORT.k].done, b.t[SORT.k].due) ?? -1 : -2; return (va - vb) * SORT.d; });
    const cell = (t, T) => { if (!t) return `<td class="n x">ไม่ต้องทำ</td>`; if (!t.due) return `<td class="n x">–</td>`; const p = pct(t.done, t.due); const tip = t.miss.length ? `ขาด: ${dl(C, t.miss)}` : ''; return `<td class="n" title="${tip}"><span class="pill ${cls(p)}">${T.f === 'M' ? (t.done ? '✓ ' + t.cnt + ' ครั้ง' : 'ยังไม่ทำ') : t.done + '/' + t.due}</span></td>`; };
    V.innerHTML = `<div class="panel"><table><thead><tr><th>รหัส</th><th>สาขา</th><th>Area</th><th>Type</th><th>Size</th><th>FRM</th>${TOPICS.map(T => `<th class="n" data-s="${T.k}">${T.short}</th>`).join('')}<th class="n" data-s="pct">รวม</th></tr></thead><tbody>${list.map(r => `<tr><td>${r.s.code}</td><td>${r.s.name}</td><td>${r.s.area}</td><td>${r.s.type}</td><td>${r.s.size}</td><td>${r.s.frm || ''}</td>${TOPICS.map(T => cell(r.t[T.k], T)).join('')}<td class="n"><b style="color:${col(r.pct)}">${fp(r.pct)}</b></td></tr>`).join('')}</tbody></table></div>
      <div class="note">${list.length} สาขา • เอาเมาส์ชี้ที่ตัวเลขเพื่อดูวันที่ขาด • กดหัวคอลัมน์เพื่อเรียง • วันนี้ (${C.today}/${C.M}) ยังไม่นับ ดูได้ในแท็บปฏิทิน</div>`;
    V.querySelectorAll('th[data-s]').forEach(th => th.onclick = () => { SORT = { k: th.dataset.s, d: SORT && SORT.k === th.dataset.s ? -SORT.d : 1 }; render(); });
  } else if (TAB === 'area') {
    const g = {}; rows.forEach(r => (g[r.s.region + '|' + r.s.area] = g[r.s.region + '|' + r.s.area] || []).push(r));
    const keys = Object.keys(g).sort();
    const line = (lbl, rs, b) => `<tr${b ? ' style="font-weight:700"' : ''}><td>${lbl}</td><td class="n">${rs.length}</td>${TOPICS.map(T => { const a = topicAgg(rs, T.k); return `<td class="n"><span class="pill ${cls(a.p)}">${fp(a.p)}</span></td>`; }).join('')}<td class="n">${rs.filter(r => r.full).length}</td></tr>`;
    V.innerHTML = `<div class="panel"><table><thead><tr><th>Region / Area</th><th class="n">สาขา</th>${TOPICS.map(T => `<th class="n">${T.short}</th>`).join('')}<th class="n">ครบทุกหัวข้อ</th></tr></thead><tbody>${keys.map(k => line(k.replace('|', ' • '), g[k])).join('')}${line('รวม', rows, 1)}</tbody></table></div>`;
  } else if (TAB === 'cal') {
    const ks = [['open', 'เปิดร้าน'], ['close', 'ปิดร้าน'], ['fd', 'Fraud Daily'], ['ti', 'Trade-in'], ['fw', 'Fraud Weekly'], ['wi', 'Weekly Intransit']];
    const N = DATA.days, all = [...Array(C.today).keys()].map(i => i + 1);
    const code = (r, d) => {
      if (CALK === 'open' || CALK === 'close') { const c = (DATA.sd[r.s.code] || '')[d - 1] || '0'; if (CALK === 'open') return '25'.includes(c) ? 2 : '14'.includes(c) ? 1 : 0; return '345'.includes(c) ? 2 : 0; }
      if (!r.t[CALK]) return -1;
      const isW = CALK === 'fw' || CALK === 'wi', wed = new Date(C.Y, C.M - 1, d).getDay() === 3, b = (DATA[CALK][r.s.code] || '')[d - 1] === '1';
      if (isW && !wed) return b ? 1 : -1; return b ? 2 : 0;
    };
    const wd = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    V.innerHTML = `<div class="filters">${ks.map(([k, l]) => `<button class="btn ${CALK === k ? 'p' : ''}" data-c="${k}">${l}</button>`).join('')}</div>
      <div class="legend"><span style="--c:var(--okb)">ทำแล้ว</span><span style="--c:var(--warnb)">${CALK === 'open' ? 'ทำหลัง 12:00' : CALK === 'fw' || CALK === 'wi' ? 'ทำแต่ไม่ใช่วันพุธ (ไม่นับ)' : ''}</span><span style="--c:var(--badb)">ไม่ได้ทำ</span><span style="--c:var(--na)">ไม่ต้องทำ</span></div>
      <div class="panel"><table class="cal"><thead><tr><th class="sh">สาขา</th>${all.map(d => `<th class="n" style="text-align:center;padding:2px">${d}<br><span style="font-weight:400">${wd[new Date(C.Y, C.M - 1, d).getDay()]}</span></th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><td class="sh">${r.s.code} ${r.s.name}</td>${all.map(d => { const c = code(r, d), op = CALK === 'open' ? ((DATA.sdOpen[r.s.code] || '').split(',')[d - 1] || '') : ''; return `<td class="${c < 0 ? 'cn' : 'c' + c}" title="${d}/${C.M}${op ? ' เปิด ' + op : ''}">${c === 2 ? '✓' : c === 1 ? '!' : ''}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="note">วันที่ ${C.today} คือวันนี้ ข้อมูล ณ ${DATA.asOf.slice(11)} น.</div>`;
    V.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { CALK = b.dataset.c; render(); });
  } else if (TAB === 'tm') {
    const ppl = tmPeople().filter(p => { const fr = $('#sFrm').value; return !fr || p.name === fr; });
    V.innerHTML = `<div class="panel"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ตำแหน่ง</th><th class="n">เป้า (สาขา)</th><th class="n">ตรวจแล้ว (สาขาไม่ซ้ำ)</th><th class="n">Sales</th><th class="n">After Sales</th><th class="n">Retention</th><th>Area ที่ตรวจ</th><th>สถานะ</th></tr></thead><tbody>${ppl.map(p => `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.pos}</td><td class="n">${p.target || '–'}</td><td class="n">${p.n}</td><td class="n">${p.fns['Sales'] || 0}</td><td class="n">${p.fns['After Sales'] || 0}</td><td class="n">${p.fns['Retention'] || 0}</td><td>${[...p.areas].join(', ')}</td><td>${p.ok == null ? '<span class="x">ไม่มีเป้า</span>' : p.ok ? '<span class="pill g">ครบ</span>' : `<span class="pill r">ขาด ${p.target - p.n}</span>`}</td></tr>`).join('')}</tbody></table></div>
      <div class="note">เป้า: AM 2 สาขา, FC 2 สาขา, FRM 4 สาขา (นับสาขาไม่ซ้ำ) • ตัวเลข Sales/After Sales/Retention = จำนวนครั้งที่ตรวจ • AM ที่ดูแล 2 พื้นที่ ดูคอลัมน์ Area ที่ตรวจว่าครบทั้ง 2 พื้นที่หรือไม่ • FRM ใน Master ที่ยังไม่ได้ตรวจแสดงด้วย</div>`;
  } else if (TAB === 'miss') {
    const L = missList(C, rows);
    V.innerHTML = `<div class="panel"><table><thead><tr><th>รหัส</th><th>สาขา</th><th>Area</th><th>FRM</th><th>หัวข้อ</th><th class="n">ขาด</th><th>วันที่ขาด</th></tr></thead><tbody>${L.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td class="n">${x[5]}</td><td style="white-space:normal;min-width:260px">${x[6]}</td></tr>`).join('')}</tbody></table></div><div class="note">${L.length} รายการ</div>`;
  } else {
    V.innerHTML = `<div class="panel" style="padding:14px 18px"><table><thead><tr><th>หัวข้อ</th><th>สาขาที่ต้องทำ</th><th>ความถี่</th><th>วิธีนับ</th></tr></thead><tbody>
      <tr><td>Store Daily – เปิดร้าน</td><td>ทุกสาขา</td><td>รายวัน</td><td>มี Shop Open ก่อน 12:00 น. (ทำหลัง 12:00 = ไม่นับ แสดงสีเหลืองในปฏิทิน)</td></tr>
      <tr><td>Store Daily – ปิดร้าน</td><td>ทุกสาขา</td><td>รายวัน</td><td>มี Shop Close ในวันนั้น</td></tr>
      <tr><td>Fraud Daily</td><td>ตามตัวเลือก Fraud ด้านบน</td><td>รายวัน</td><td>มีกลุ่ม Daily ในวันนั้น</td></tr>
      <tr><td>Fraud Weekly</td><td>ตามตัวเลือก Fraud ด้านบน</td><td>ทุกวันพุธ</td><td>ทำวันพุธเท่านั้น วันอื่นไม่นับ</td></tr>
      <tr><td>Weekly Intransit</td><td>ทุกสาขา</td><td>ทุกวันพุธ</td><td>อัปโหลดรูปวันพุธเท่านั้น วันอื่นไม่นับ</td></tr>
      <tr><td>Trade-in</td><td>ทุกสาขา</td><td>รายวัน</td><td>มีการส่งแบบฟอร์มในวันนั้น (ตอบ “ไม่มี” ก็นับว่าทำ)</td></tr>
      <tr><td>Cross Store</td><td>ทุกสาขา</td><td>รายเดือน</td><td>สาขาถูกตรวจอย่างน้อย 1 ครั้งในเดือน</td></tr>
      <tr><td>Store Visit</td><td>ทุกสาขา</td><td>รายเดือน</td><td>สาขาถูกตรวจเยี่ยมอย่างน้อย 1 ครั้งในเดือน</td></tr>
      <tr><td>Retail TM</td><td>ทุกสาขา / รายบุคคล</td><td>รายเดือน</td><td>รายสาขา: ถูกตรวจในเดือน • รายบุคคล: AM 2, FC 2, FRM 4 สาขาไม่ซ้ำ</td></tr>
      </tbody></table><div class="note">รายวัน/รายสัปดาห์นับถึงเมื่อวาน (วันที่ ${C.today - 1}) เพราะวันนี้ยังไม่จบวัน • สาขาที่ไม่อยู่ใน Master Shop จะไม่ถูกนับ</div></div>`;
  }
}
function missList(C, rows) {
  const L = [];
  for (const r of rows) for (const T of TOPICS) { const t = r.t[T.k]; if (!t || !t.due) continue; if (T.f === 'M') { if (!t.done) L.push([r.s.code, r.s.name, r.s.area, r.s.frm, T.name, 1, 'ยังไม่ทำในเดือนนี้']); } else if (t.miss.length) L.push([r.s.code, r.s.name, r.s.area, r.s.frm, T.name, t.miss.length, dl(C, t.miss)]); }
  return L;
}

/* ---------- Excel ---------- */
$('#bXls').onclick = () => {
  const { C, res } = compute(), rows = filt(res), wb = XLSX.utils.book_new();
  const add = (name, aoa, w) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = (w || aoa[0].map(() => 14)).map(x => ({ wch: x })); ws['!freeze'] = { xSplit: 0, ySplit: 1 }; XLSX.utils.book_append_sheet(wb, ws, name); };
  const v = (t, T) => !t ? 'ไม่ต้องทำ' : !t.due ? '-' : T.f === 'M' ? (t.done ? 'ทำแล้ว (' + t.cnt + ')' : 'ยังไม่ทำ') : t.done + '/' + t.due;
  add('สรุปรายสาขา', [['SHOP CODE', 'SHOP NAME', 'REGION', 'AREA', 'TYPE SHOP', 'SIZE', 'FRM', ...TOPICS.map(T => T.name), 'เปิดร้านหลัง 12:00 (วัน)', '% รวม', 'ครบทุกหัวข้อ'],
    ...rows.map(r => [r.s.code, r.s.name, r.s.region, r.s.area, r.s.type, r.s.size, r.s.frm, ...TOPICS.map(T => v(r.t[T.k], T)), r.late.length, Math.round(r.pct * 1000) / 10, r.full ? 'ครบ' : 'ไม่ครบ'])], [11, 40, 8, 24, 13, 6, 22, ...TOPICS.map(() => 14), 12, 8, 10]);
  const g = {}; rows.forEach(r => (g[r.s.region + '|' + r.s.area] = g[r.s.region + '|' + r.s.area] || []).push(r));
  add('สรุปรายพื้นที่', [['REGION', 'AREA', 'จำนวนสาขา', ...TOPICS.map(T => T.name + ' %'), 'สาขาที่ครบทุกหัวข้อ'],
    ...Object.keys(g).sort().map(k => [...k.split('|'), g[k].length, ...TOPICS.map(T => { const a = topicAgg(g[k], T.k); return a.p == null ? '-' : Math.round(a.p * 1000) / 10; }), g[k].filter(r => r.full).length]),
    ['รวม', '', rows.length, ...TOPICS.map(T => { const a = topicAgg(rows, T.k); return a.p == null ? '-' : Math.round(a.p * 1000) / 10; }), rows.filter(r => r.full).length]], [8, 26, 10, ...TOPICS.map(() => 14), 12]);
  add('รายการที่ขาด', [['SHOP CODE', 'SHOP NAME', 'AREA', 'FRM', 'หัวข้อ', 'จำนวนที่ขาด', 'วันที่ขาด'], ...missList(C, rows)], [11, 40, 24, 22, 26, 10, 80]);
  add('Retail TM รายบุคคล', [['รหัส', 'ชื่อ', 'ตำแหน่ง', 'เป้า (สาขา)', 'ตรวจแล้ว (สาขาไม่ซ้ำ)', 'Sales', 'After Sales', 'Retention', 'Area ที่ตรวจ', 'สถานะ'],
    ...tmPeople().map(p => [p.id, p.name, p.pos, p.target || '-', p.n, p.fns['Sales'] || 0, p.fns['After Sales'] || 0, p.fns['Retention'] || 0, [...p.areas].join(', '), p.ok == null ? 'ไม่มีเป้า' : p.ok ? 'ครบ' : 'ขาด ' + (p.target - p.n)])], [10, 26, 10, 10, 12, 8, 10, 10, 40, 10]);
  const dd = [...Array(DATA.days).keys()].map(i => i + 1);
  add('Store Daily รายวัน', [['SHOP CODE', 'SHOP NAME', 'AREA', ...dd.map(d => 'เปิด ' + d), ...dd.map(d => 'ปิด ' + d)], ...rows.map(r => { const c = DATA.sd[r.s.code] || '', o = (DATA.sdOpen[r.s.code] || '').split(','); return [r.s.code, r.s.name, r.s.area, ...dd.map(d => d > C.today ? '' : o[d - 1] || 'ไม่ทำ'), ...dd.map(d => d > C.today ? '' : '345'.includes(c[d - 1] || '0') ? '✓' : 'ไม่ทำ')]; })], [11, 40, 24, ...dd.map(() => 7), ...dd.map(() => 6)]);
  add('ข้อมูล', [['รายการ', 'ค่า'], ['เดือน', DATA.month], ['ข้อมูล ณ', DATA.asOf], ['นับรายวัน/รายสัปดาห์ถึงวันที่', C.today - 1], ['ตัวเลือก Fraud', $('#sScope').selectedOptions[0].text], ['จำนวนสาขา (หลังกรอง)', rows.length], ...Object.entries(DATA.counts).map(([k, n]) => ['แถวข้อมูล ' + k, n])], [30, 30]);
  XLSX.writeFile(wb, `Checklist_Summary_${DATA.asOf.slice(0, 10).replace(/-/g, '')}.xlsx`);
};

/* ---------- init ---------- */
function init() {
  $('#mstat').textContent = MASTER ? `Master Shop: ${MASTER.length} สาขา` : 'ยังไม่มี Master Shop — กดปุ่ม “อัปเดต Master Shop” แล้วเลือกไฟล์ ตารางประเภท checklist.xlsx';
  if (!DATA || !MASTER) { $('#start').hidden = false; $('#app').hidden = true; return; }
  $('#start').hidden = true; $('#app').hidden = false; $('#bXls').disabled = false;
  const [Y, M] = DATA.month.split('-').map(Number);
  $('#asof').textContent = `เดือน ${TH_MON[M]} ${Y + 543} • ข้อมูล ณ ${+DATA.asOf.slice(8, 10)} ${TH_MON[M]} ${DATA.asOf.slice(11)} น. • Master ${MASTER.length} สาขา`;
  const mset = new Set(MASTER.map(s => s.code)), extra = new Set();
  ['sd', 'fd', 'wi', 'ti', 'cs', 'sv'].forEach(k => Object.keys(DATA[k]).forEach(c => { if (!mset.has(c)) extra.add(c); }));
  $('#foot').textContent = extra.size ? `สาขาที่มีข้อมูลแต่ไม่อยู่ใน Master Shop (ไม่นับ) ${extra.size} สาขา: ${[...extra].map(c => c + ' ' + (DATA.names[c] || '')).join(', ')}` : '';
  fillFilters(); render();
}
['#sRegion', '#sArea', '#sType', '#sFrm', '#sScope', '#onlyMiss'].forEach(s => $(s).onchange = () => { if (s === '#sRegion') fillFilters(); LS.set('acl-scope', $('#sScope').value); render(); });
$('#q').oninput = render;
$('#bmk').href = BOOKMARKLET; $('#bmk').onclick = e => { e.preventDefault(); alert('ลากปุ่มนี้ไปวางที่แถบบุ๊กมาร์ก แล้วกดปุ่มนั้นตอนอยู่บนหน้า Retail Checklist Report'); };
{ const sc = LS.get('acl-scope'); if (sc) $('#sScope').value = sc; }
MASTER = LS.get('acl-master') || MASTER;
DATA = DATA || LS.get('acl-data');
init();
</script>
</body>
