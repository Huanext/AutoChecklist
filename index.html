<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f7f8fc; --ink:#141a2e; --ink2:#4b5470; --ink3:#8a92a8; --line:#e4e8f1;
  --accent:#2f5d8c; --accent-soft:#e6eef6; --hero1:#22385a; --hero2:#2f5583; --hero3:#4f7ca6;
  --ok:#2e8b63; --ok-soft:#e1f1e8; --part:#c98a1b; --part-soft:#faf0dc; --bad:#c9505c; --bad-soft:#f8e4e6; --nac:#98a1b5; --na-soft:#eceff5;
  --shadow:0 1px 2px rgba(20,26,46,.04),0 8px 24px rgba(20,26,46,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e111a; --panel:#161a26; --panel2:#1c2130; --ink:#eef1f8; --ink2:#b3bad0; --ink3:#7d859c; --line:#272d3f;
  --accent:#7ea6cf; --accent-soft:#1c2a3d; --hero1:#16243a; --hero2:#1f3550; --hero3:#2d4c70;
  --ok:#5fbf93; --ok-soft:#183027; --part:#d9a44a; --part-soft:#33291a; --bad:#e08590; --bad-soft:#36202a; --nac:#7d859c; --na-soft:#232838; --shadow:0 1px 2px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#0e111a; --panel:#161a26; --panel2:#1c2130; --ink:#eef1f8; --ink2:#b3bad0; --ink3:#7d859c; --line:#272d3f;
  --accent:#7ea6cf; --accent-soft:#1c2a3d; --hero1:#16243a; --hero2:#1f3550; --hero3:#2d4c70;
  --ok:#5fbf93; --ok-soft:#183027; --part:#d9a44a; --part-soft:#33291a; --bad:#e08590; --bad-soft:#36202a; --nac:#7d859c; --na-soft:#232838; --shadow:0 1px 2px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1440px;margin:0 auto;padding:20px 24px 60px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin:-20px -24px 18px;padding:26px 24px 22px;background:linear-gradient(120deg,var(--hero1),var(--hero2) 60%,var(--hero3));color:#fff}
header.top h1{font-size:26px;margin:0;letter-spacing:-.3px;font-weight:800}
header.top h1 small{display:block;font-size:13px;color:rgba(255,255,255,.85);font-weight:400;margin-top:4px;letter-spacing:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:rgba(255,255,255,.82)} .meta b{color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)} .btn:disabled{opacity:.5;cursor:default}
header.top .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
header.top .btn.hl{background:#fff;color:var(--hero1);border-color:#fff;font-weight:700}
:root[data-theme="dark"] header.top .btn.hl{color:#16243a}
.btn.primary{background:linear-gradient(120deg,var(--hero1),var(--hero2));border-color:transparent;color:#fff}
.btn.spin::first-letter{display:inline-block}
.filters{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);padding:10px 0;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label.chk{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=search]{min-width:200px}
.ms{position:relative}
.ms>button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 28px 6px 10px;cursor:pointer;min-width:130px;max-width:260px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ms>button:after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.ms>button small{display:block;font-size:10.5px;color:var(--ink3);line-height:1.1}
.ms.on>button{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ms .pop{display:none;position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:300px;max-width:86vw;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,26,46,.18);padding:8px}
.ms.open .pop{display:block}
.ms .pop input[type=search]{width:100%;min-width:0;margin-bottom:6px}
.ms .acts{display:flex;justify-content:space-between;font-size:12px;margin:2px 4px 6px} .ms .acts a{color:var(--accent);cursor:pointer}
.ms .list{max-height:280px;overflow:auto}
.ms label.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.ms label.opt:hover{background:var(--panel2)} .ms label.opt input{margin:3px 0 0;flex:none} .ms label.opt span{flex:1;word-break:break-word} .ms label.opt small{color:var(--ink3)}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.kpi{padding:12px 12px 12px 16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--nac))}
.kpi .t{font-size:12px;color:var(--ink2);min-height:34px} .kpi .t span{color:var(--ink3);font-size:11.5px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--na-soft);margin-top:8px} .bar i{display:block;height:100%}
section{margin-top:18px}
section > h2{font-size:16px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
section > h2:before{content:'';width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--hero2),var(--hero3));align-self:center}
section > h2 span{font-size:12px;font-weight:400;color:var(--ink3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink2)}
.tab.on{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:700;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel2);z-index:2;cursor:pointer}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--panel2)} tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.g{background:var(--ok-soft);color:var(--ok)} .y{background:var(--part-soft);color:var(--part)} .r{background:var(--bad-soft);color:var(--bad)} .x{color:var(--ink3)}
.cal{table-layout:fixed;min-width:900px}
.cal col.sc{width:260px} .cal th{padding:6px 2px;text-align:center;cursor:default}
.cal th.sh{text-align:left;padding:9px 10px}
.cal td{padding:0;text-align:center;height:26px;font-size:11px;font-weight:700;border-right:1px solid var(--panel)}
.cal td.sh{text-align:left;padding:0 10px;position:sticky;left:0;background:var(--panel);z-index:1;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal td.sh small{color:var(--ink3)} .cal th.sh{position:sticky;left:0;z-index:3}
.c0{background:var(--bad-soft);color:var(--bad)} .c1{background:var(--part-soft);color:var(--part)} .c2{background:var(--ok-soft);color:var(--ok)} .cn{background:var(--na-soft)}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;background:var(--panel);margin:20px auto;max-width:720px}
.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
.sub{color:var(--ink2);font-size:13px}
.note{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.7}
code{background:var(--na-soft);padding:1px 5px;border-radius:4px}
.bm{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-weight:600}
body.expand #view .panel{position:fixed;inset:56px 12px 12px;max-height:none;z-index:45}
body.expand::before{content:'';position:fixed;inset:0;background:rgba(8,10,16,.45);z-index:44}
#bExp{margin-left:auto} body.expand #bExp{position:fixed;top:12px;right:12px;z-index:46}
.setup{border-color:var(--part);background:var(--part-soft);padding:12px 16px;margin-bottom:12px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}
#toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:440px}
@media (max-width:640px){.wrap{padding:14px 16px 40px} header.top{margin:-14px -16px 16px;padding:20px 16px 18px} input[type=search]{min-width:0;width:100%} .ms{flex:1 1 45%} .ms>button{width:100%;max-width:none} .filters{position:static} .kpi .v{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="ttl" title="">Auto Checklist<small>สรุปการทำ Retail Store Checklist 7 หัวข้อ เทียบ Master Shop · เดือนปัจจุบัน</small></h1>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">

    </div>
  </header>
  <div id="toast" hidden></div>
  <div id="start" class="drop">
    <div style="font-size:16px;font-weight:600;margin-bottom:6px">ยังไม่มีข้อมูล</div>
    <div class="sub" style="margin-bottom:10px" id="howto"></div>
    <div class="sub">หรือลากไฟล์ checklist_data_*.json มาวางที่นี่</div>
    <div class="note" id="mstat"></div>
    <div class="note" id="bmwrap" hidden><a class="bm" id="bmk" href="#">Auto Checklist</a></div>
  </div>
  <div id="app" hidden>
    <div class="filters">

      <div class="ms" data-k="area" data-l="Area"></div>
      <div class="ms" data-k="type" data-l="TYPE SHOP"></div>

      <div class="ms" data-k="frm" data-l="FRM"></div>
      <div class="ms" data-k="code" data-l="สาขา"></div>
      <select id="sScope" title="สาขาที่ต้องทำ Fraud Checklist">

        <option value="s">Fraud: Size S</option>
        <option value="sfrm">Fraud: Size S และมี FRM</option>
        <option value="any">Fraud: Size S หรือมี FRM</option>
      </select>
      <input type="search" id="q" placeholder="ค้นหารหัส / ชื่อสาขา">
      <label class="chk"><input type="checkbox" id="onlyMiss"> เฉพาะที่ยังไม่ครบ</label>
      <button class="btn" id="bClr">ล้างตัวกรอง</button>
    </div>
    <div id="setup" class="card setup" hidden></div>
    <div class="grid cards" id="cards"></div>
    <section>
      <h2 id="secTitle">รายละเอียด <span id="secSub"></span></h2>
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
    </section>
    <div class="note" id="foot"></div>
  </div>
  <div class="foot">
    <label class="btn">โหลดไฟล์ข้อมูล (.json)<input type="file" id="fData" accept=".json" hidden></label>
    <label class="btn">อัปเดต Master Shop (.xlsx)<input type="file" id="fMaster" accept=".xlsx,.xls" hidden></label>
  </div>
</div>

}

    put('open', days(sd, '25', C.dueOpen), C.dueOpen, sd[C.today - 1] ? ('25'.includes(sd[C.today - 1]) ? 'ok' : '14'.includes(sd[C.today - 1]) ? 'late' : 'no') : 'no');

  } else if (TAB === 'miss') {

    V.innerHTML = `<div class="panel"><table><thead><tr><th>รหัส</th><th>สาขา</th><th>Area</th><th>FRM</th><th>หัวข้อ</th><th class="n">ขาด</th><th>วันที่ขาด</th></tr></thead><tbody>${L.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td class="n">${x[5]}</td><td style="white-space:normal;min-width:260px">${x[6]}</td></tr>`).join('')}</tbody></table></div><div class="note">${L.length} รายการ${MISSK ? ` • เฉพาะหัวข้อ ${TOPICS.find(T => T.k === MISSK).name} (คลิกการ์ดเดิมอีกครั้งเพื่อดูทุกหัวข้อ)` : ''}</div>`;
  } else {
    V.innerHTML = `<div class="panel" style="padding:14px 18px"><table><thead><tr><th>หัวข้อ</th><th>สาขาที่ต้องทำ</th><th>ความถี่</th><th>วิธีนับ</th></tr></thead><tbody>
      <tr><td>Store Daily – เปิดร้าน</td><td>ทุกสาขา</td><td>รายวัน</td><td>มี Shop Open ก่อน 12:00 น. (ทำหลัง 12:00 = ไม่นับ แสดงสีเหลืองในปฏิทิน)</td></tr>
      <tr><td>Store Daily – ปิดร้าน</td><td>ทุกสาขา</td><td>รายวัน</td><td>มี Shop Close ก่อน 22:00 น. (ทำหลัง 22:00 = ไม่นับ แสดงสีเหลืองในปฏิทิน)</td></tr>
      <tr><td>Fraud Daily</td><td>ตามตัวเลือก Fraud ด้านบน</td><td>รายวัน</td><td>มีกลุ่ม Daily ในวันนั้น</td></tr>
      <tr><td>Fraud Weekly</td><td>ตามตัวเลือก Fraud ด้านบน</td><td>ทุกวันพุธ</td><td>ทำวันพุธเท่านั้น วันอื่นไม่นับ</td></tr>
      <tr><td>Weekly Intransit</td><td>ทุกสาขา ยกเว้น TYPE Lotus's</td><td>ทุกวันพุธ</td><td>อัปโหลดรูปวันพุธเท่านั้น วันอื่นไม่นับ</td></tr>

  }
}
function missList(C, rows) {
  const L = [];
  for (const r of rows) for (const T of TOPICS) { const t = r.t[T.k]; if (!t || !t.due) continue; if (T.f === 'M') { if (!t.done) L.push([r.s.code, r.s.name, r.s.area, r.s.frm, T.name, 1, 'ยังไม่ทำในเดือนนี้']); } else if (t.miss.length) L.push([r.s.code, r.s.name, r.s.area, r.s.frm, T.name, t.miss.length, dl(C, t.miss)]); }
  return L;
}

/* ---------- Excel ---------- */

  const v = (t, T) => !t ? 'ไม่ต้องทำ' : !t.due ? '-' : T.f === 'M' ? (t.done ? 'ทำแล้ว (' + t.cnt + ')' : 'ยังไม่ทำ') : t.done + '/' + t.due;
  add('สรุปรายสาขา', [['SHOP CODE', 'SHOP NAME', 'REGION', 'AREA', 'TYPE SHOP', 'SIZE', 'FRM', ...TOPICS.map(T => T.name), 'เปิดร้านหลัง 12:00 (วัน)', 'ปิดร้านหลัง 22:00 (วัน)', '% รวม', 'ครบทุกหัวข้อ'],
    ...rows.map(r => [r.s.code, r.s.name, r.s.region, r.s.area, r.s.type, r.s.size, r.s.frm, ...TOPICS.map(T => v(r.t[T.k], T)), r.late.length, r.lateClose.length, Math.round(r.pct * 1000) / 10, r.full ? 'ครบ' : 'ไม่ครบ'])], [11, 40, 8, 24, 13, 6, 22, ...TOPICS.map(() => 14), 12, 12, 8, 10]);
  const g = {}; rows.forEach(r => (g[r.s.region + '|' + r.s.area] = g[r.s.region + '|' + r.s.area] || []).push(r));
  add('สรุปรายพื้นที่', [['REGION', 'AREA', 'จำนวนสาขา', ...TOPICS.map(T => T.name + ' %'), 'สาขาที่ครบทุกหัวข้อ'],
    ...Object.keys(g).sort().map(k => [...k.split('|'), g[k].length, ...TOPICS.map(T => { const a = topicAgg(g[k], T.k); return a.p == null ? '-' : Math.round(a.p * 1000) / 10; }), g[k].filter(r => r.full).length]),
    ['รวม', '', rows.length, ...TOPICS.map(T => { const a = topicAgg(rows, T.k); return a.p == null ? '-' : Math.round(a.p * 1000) / 10; }), rows.filter(r => r.full).length]], [8, 26, 10, ...TOPICS.map(() => 14), 12]);
  add('รายการที่ขาด', [['SHOP CODE', 'SHOP NAME', 'AREA', 'FRM', 'หัวข้อ', 'จำนวนที่ขาด', 'วันที่ขาด'], ...missList(C, rows)], [11, 40, 24, 22, 26, 10, 80]);
  add('Retail TM รายบุคคล', [['รหัส', 'ชื่อ', 'ตำแหน่ง', 'เป้า (สาขา)', 'ตรวจแล้ว (สาขาไม่ซ้ำ)', 'Sales', 'After Sales', 'Retention', 'Area ที่ตรวจ', '%', 'สถานะ'],
    ...tmPeople().map(p => [p.id, p.name, p.pos, p.target || '-', p.n, p.fns['Sales'] || 0, p.fns['After Sales'] || 0, p.fns['Retention'] || 0, [...p.areas].join(', '), p.pc == null ? '-' : Math.round(p.pc * 1000) / 10, p.ok == null ? 'ไม่มีเป้า' : p.ok ? 'ครบ 100%' : p.why])], [10, 26, 10, 10, 12, 8, 10, 10, 40, 8, 30]);
  const dd = [...Array(DATA.days).keys()].map(i => i + 1);
  add('Store Daily รายวัน', [['SHOP CODE', 'SHOP NAME', 'AREA', ...dd.map(d => 'เปิด ' + d), ...dd.map(d => 'ปิด ' + d)], ...rows.map(r => { const c = DATA.sd[r.s.code] || '', o = (DATA.sdOpen[r.s.code] || '').split(','); return [r.s.code, r.s.name, r.s.area, ...dd.map(d => d > C.today ? '' : o[d - 1] || 'ไม่ทำ'), ...dd.map(d => d > C.today ? '' : closeCode(r.s.code, d) ? (((DATA.sdClose && (DATA.sdClose[r.s.code] || '').split(',')[d - 1]) || '✓')) : 'ไม่ทำ')]; })], [11, 40, 24, ...dd.map(() => 7), ...dd.map(() => 6)]);
  add('ข้อมูล', [['รายการ', 'ค่า'], ['เดือน', DATA.month], ['ข้อมูล ณ', DATA.asOf], ['นับรายวัน/รายสัปดาห์ถึงวันที่', C.today - 1], ['ตัวเลือก Fraud', $('#sScope').selectedOptions[0].text], ['จำนวนสาขา (หลังกรอง)', rows.length], ...Object.entries(DATA.counts).map(([k, n]) => ['แถวข้อมูล ' + k, n])], [30, 30]);

};

/* ---------- init ---------- */
function init() {
  $('#mstat').textContent = MASTER ? `Master Shop: ${MASTER.length} สาขา` : 'ยังไม่มี Master Shop — กดปุ่ม “อัปเดต Master Shop” แล้วเลือกไฟล์ ตารางประเภท checklist.xlsx';
  if (!DATA || !MASTER) { $('#start').hidden = false; $('#app').hidden = true; return; }
  $('#start').hidden = true; $('#app').hidden = false; $('#bXls').disabled = false;
  const [Y, M] = DATA.month.split('-').map(Number);
  const g = DATA.gen ? new Date(DATA.gen) : null;
  $('#meta').innerHTML = `<span>เดือน <b>${TH_MON[M]} ${Y + 543}</b></span><span>ข้อมูล ณ <b>${+DATA.asOf.slice(8, 10)} ${TH_MON[M]} ${DATA.asOf.slice(11)} น.</b></span><span>Master <b>${MASTER.length}</b> สาขา</span>`;
  const mset = new Set(MASTER.map(s => s.code)), extra = new Set();
  ['sd', 'fd', 'wi', 'ti', 'cs', 'sv'].forEach(k => Object.keys(DATA[k]).forEach(c => { if (c && c !== 'null' && !mset.has(c)) extra.add(c); }));
  $('#foot').textContent = extra.size ? `สาขาที่มีข้อมูลแต่ไม่อยู่ใน Master Shop (ไม่นับ) ${extra.size} สาขา: ${[...extra].map(c => c + ' ' + (DATA.names[c] || '')).join(', ')}` : '';
  const su = $('#setup');
  if (LOCAL && !DATA.gen) { su.hidden = false; su.innerHTML = '<b>อัปเดตข้อมูล</b><br>กดปุ่ม <b>Auto Checklist Update</b> บนหน้าจอ Desktop (ครั้งแรกให้ดับเบิลคลิกไฟล์ <b>อัปเดต Auto Checklist.bat</b> ใน <code>D:\\Auto Checklist</code> หนึ่งครั้ง ระบบจะสร้างปุ่มบน Desktop ให้) → ล็อกอินในหน้าต่างเบราว์เซอร์ถ้าระบบถาม → รอ 1–3 นาที ระบบดึงข้อมูลและขึ้น GitHub ให้เอง'; } else su.hidden = true;
  render();
}
['#sScope', '#onlyMiss'].forEach(s => $(s).onchange = () => { LS.set('acl-scope', $('#sScope').value); render(); });

// the two update buttons stay hidden; double-click the title to show/hide them (remembered per browser)
const showAdm = on => document.querySelectorAll('.adm').forEach(b => b.hidden = !on);
showAdm(LS.get('acl-adm') === true);
$('#ttl').ondblclick = () => { const on = !(LS.get('acl-adm') === true); LS.set('acl-adm', on); showAdm(on); toast(on ? 'แสดงปุ่มอัปเดตแล้ว (ดับเบิลคลิกชื่อ Auto Checklist อีกครั้งเพื่อซ่อน)' : 'ซ่อนปุ่มอัปเดตแล้ว', 4000); };
{ const th = LS.get('acl-theme'); if (th) document.documentElement.dataset.theme = th; }
document.addEventListener('change', e => { if (e.target.id === 'sPos') render(); });
$('#q').oninput = render;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && EXPAND) { EXPAND = false; render(); } });
$('#bmk').href = BOOKMARKLET; $('#bmk').onclick = e => { e.preventDefault(); alert('ลากปุ่มนี้ไปวางที่แถบบุ๊กมาร์ก แล้วกดปุ่มนั้นตอนอยู่บนหน้า Retail Checklist Report'); };
{ const sc = LS.get('acl-scope'); if (sc) $('#sScope').value = sc; }
MASTER = LS.get('acl-master') || MASTER;
DATA = DATA || LS.get('acl-data');
if (window.ACL_DATA && (!DATA || stamp(window.ACL_DATA) >= stamp(DATA) || window.ACL_DATA.asOf >= DATA.asOf)) { DATA = window.ACL_DATA; LS.set('acl-data', DATA); }
if (DATA && DATA.master && DATA.master.length) MASTER = DATA.master;
$('#howto').innerHTML = 'กดปุ่ม <b>Auto Checklist Update</b> บน Desktop (ครั้งแรกดับเบิลคลิกไฟล์ <b>อัปเดต Auto Checklist.bat</b> ใน D:\\Auto Checklist)';
